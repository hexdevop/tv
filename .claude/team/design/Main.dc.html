<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вариант А: Затмение</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer;margin:0;padding:0;border:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #06070A; color: #F4F2EE; font-family: Manrope, sans-serif">

  <div style="position: absolute; right: -210px; top: -330px; width: 980px; height: 980px; border-radius: 50%; background: radial-gradient(circle, {{glow}} 0%, {{glowSoft}} 38%, transparent 68%); transition: background .45s ease-out"></div>
  <div style="position: absolute; right: 100px; top: -30px; width: 400px; height: 400px; border-radius: 50%; background: #06070A; box-shadow: 0 -10px 34px 2px {{color}}; transition: box-shadow .45s ease-out"></div>

  <div style="position: absolute; left: 48px; top: 38px; display: flex; align-items: baseline; gap: 18px">
    <span style="font-family: Unbounded, sans-serif; font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -0.02em">21:40</span>
    <span style="font-size: 22px; font-weight: 500; color: #C9C7C2">пятница, 30 октября</span>
  </div>

  <div style="position: absolute; left: 48px; top: 148px; width: 780px">
    <div style="font-family: Unbounded, sans-serif; font-weight: 500; font-size: 80px; line-height: 1.04; letter-spacing: -0.03em">{{title}}</div>
    <div style="margin-top: 16px; font-size: 26px; font-weight: 500; color: #D6D3CD">{{sub}}</div>
  </div>

  <div style="position: absolute; left: 48px; right: 48px; top: 402px; height: 164px; display: flex; gap: 12px">
    <sc-for list="{{apps}}" as="item" hint-placeholder-count="6">
      <button onClick="{{item.pick}}" aria-label="{{item.label}}" style="flex: {{item.grow}} 1 0; min-width: 0; border-radius: 22px; background: {{item.bg}}; color: {{item.ink}}; box-sizing: border-box; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; transition: flex-grow .22s ease-out, background .22s ease-out">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
        <span style="font-size: 22px; font-weight: 700; line-height: 1.15; white-space: nowrap">{{item.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 48px; right: 48px; top: 594px; height: 88px; display: flex; align-items: center; gap: 6px">
    <sc-for list="{{dock}}" as="item" hint-placeholder-count="7">
      <button onClick="{{item.pick}}" style="height: 60px; flex: 1 1 auto; border-radius: 30px; background: {{item.bg}}; color: {{item.ink}}; font-size: 22px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .18s ease-out">
        <sc-if value="{{item.live}}" hint-placeholder-val="{{ false }}">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: #35D07F"></span>
        </sc-if>
        <span>{{item.label}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 'YouTube' };
  }
  renderVals() {
    const f = this.state.focus;
    const appsRaw = [
      { label: 'YouTube', sub: 'Продолжить просмотр', color: '#E5261C', rgb: '229,38,28', ink: '#FFFFFF', d: 'M8 5.5v13l10.5-6.5z' },
      { label: 'TelecomTV', sub: 'Телеканалы онлайн', color: '#2368E8', rgb: '35,104,232', ink: '#FFFFFF', d: 'M4 6h16v11H4z M9 20h6' },
      { label: 'Chrome', sub: 'Браузер', color: '#F2B632', rgb: '242,182,50', ink: '#14120C', d: 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18' },
      { label: 'Play Маркет', sub: 'Новые приложения', color: '#17B97A', rgb: '23,185,122', ink: '#04140D', d: 'M5 8h14l-1 12H6z M9 8a3 3 0 0 1 6 0' },
      { label: 'Файлы', sub: 'Фото и видео с флешки', color: '#7E3FE0', rgb: '126,63,224', ink: '#FFFFFF', d: 'M3 6h6l2 2h10v11H3z' },
      { label: 'Все', sub: 'Все приложения на телевизоре', color: '#E7E4DE', rgb: '231,228,222', ink: '#14120C', d: 'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z' },
    ];
    const dockRaw = [
      { label: 'ТВ-каналы', sub: 'Антенна', color: '#C9D2E0', rgb: '201,210,224' },
      { label: 'HDMI 1', sub: 'Есть сигнал', color: '#35D07F', rgb: '53,208,127', live: true },
      { label: 'HDMI 2', sub: 'Нет сигнала', color: '#8C8F96', rgb: '140,143,150' },
      { label: 'Картинка', sub: 'Яркость, контраст, режим', color: '#6FB7FF', rgb: '111,183,255' },
      { label: 'Звук', sub: 'Громкость и режим', color: '#6FB7FF', rgb: '111,183,255' },
      { label: 'Сеть', sub: 'Wi-Fi и кабель', color: '#6FB7FF', rgb: '111,183,255' },
      { label: 'Настройки', sub: 'Все настройки системы', color: '#6FB7FF', rgb: '111,183,255' },
    ];
    const cur = appsRaw.concat(dockRaw).find((x) => x.label === f);
    const apps = appsRaw.map((x) => {
      const on = x.label === f;
      return { ...x, grow: on ? 2.1 : 1, bg: on ? x.color : '#15171C', ink: on ? x.ink : '#ECE9E3', pick: () => this.setState({ focus: x.label }) };
    });
    const dock = dockRaw.map((x) => {
      const on = x.label === f;
      return { ...x, bg: on ? '#F4F2EE' : 'transparent', ink: on ? '#0B0C0F' : '#ECE9E3', live: !!x.live, pick: () => this.setState({ focus: x.label }) };
    });
    return {
      title: cur.label === 'Все' ? 'Все приложения' : cur.label,
      sub: cur.sub,
      color: cur.color,
      glow: `rgba(${cur.rgb},.62)`,
      glowSoft: `rgba(${cur.rgb},.2)`,
      apps,
      dock,
    };
  }
}
</script>
</body>
</html>
