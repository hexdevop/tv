<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель: Картинка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer;margin:0;padding:0;border:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #2E343D; color: #F4F2EE; font-family: Manrope, sans-serif">
  <div style="position: absolute; left: 48px; bottom: 44px; font-size: 22px; font-weight: 500">Видео продолжает идти, настройки видны сразу</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 250px; box-sizing: border-box; padding: 26px 48px 30px; background: #06070A; display: flex; gap: 40px; align-items: stretch">
    <div style="width: 300px; flex: none; display: flex; flex-direction: column; justify-content: space-between">
      <div style="font-family: Unbounded, sans-serif; font-weight: 500; font-size: 26px">Картинка</div>
      <div style="font-family: Unbounded, sans-serif; font-weight: 300; font-size: 96px; line-height: 1; letter-spacing: -0.03em; color: #6FB7FF">{{value}}</div>
      <div style="font-size: 26px; font-weight: 700">{{name}}</div>
    </div>
    <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; gap: 8px; flex-wrap: nowrap">
        <sc-for list="{{rows}}" as="item" hint-placeholder-count="6">
          <button onClick="{{item.pick}}" style="flex: 1 1 auto; height: 56px; border-radius: 28px; background: {{item.bg}}; color: {{item.ink}}; font-size: 21px; font-weight: 700; white-space: nowrap; transition: background .18s ease-out">{{item.short}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 6px; height: 74px; align-items: flex-end">
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="40">
          <div style="flex: 1 1 0; height: {{t.h}}; border-radius: 3px; background: {{t.c}}; transition: background .12s ease-out"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 22px; font-weight: 500; color: #D6D3CD">
        <span>Влево: меньше</span>
        <span>Вправо: больше</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 'Яркость' };
  }
  renderVals() {
    const raw = [
      { short: 'Режим', name: 'Стандартный', v: 50, text: true },
      { short: 'Яркость', v: 50 }, { short: 'Контраст', v: 55 },
      { short: 'Цвет', v: 50 }, { short: 'Резкость', v: 30 }, { short: 'Подсветка', v: 80 },
    ];
    const cur = raw.find((x) => x.short === this.state.focus);
    const rows = raw.map((x) => {
      const on = x.short === this.state.focus;
      return { ...x, bg: on ? '#F4F2EE' : '#191B21', ink: on ? '#0B0C0F' : '#ECE9E3', pick: () => this.setState({ focus: x.short }) };
    });
    const ticks = Array.from({ length: 40 }, (_, i) => {
      const lit = (i + 1) / 40 <= cur.v / 100;
      return { h: (22 + i * 1.3) + 'px', c: lit ? '#6FB7FF' : '#23262D' };
    });
    return { rows, ticks, value: cur.text ? 'Авто' : String(cur.v), name: cur.name || cur.short };
  }
}
</script>
</body>
</html>
